services:
  web:
    build: .
    image: hipstermaps:latest
    ports:
      - "5000:80"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_ENV=${RAILS_ENV:-production}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  worker:
    image: hipstermaps:latest
    command: ["./bin/jobs"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_ENV=${RAILS_ENV:-production}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    depends_on:
      web:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hipstermaps_production
      POSTGRES_USER: hipstermaps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hipstermaps -d hipstermaps_production"]
      interval: 600s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  postgres_data:
